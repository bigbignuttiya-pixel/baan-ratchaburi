<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>บ้านราชบุรี 3D</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f1114"><link rel="icon" href="favicon.png">
<style>
:root{--panel:rgba(20,22,26,.88);--line:rgba(255,255,255,.12);--tx:#eef0f2;--mut:#9aa1a9;--acc:#e8b86a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1114;color:var(--tx);font-family:"Noto Sans Thai","Sukhumvit Set",-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:10px 12px 22px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none;display:flex;flex-direction:column;gap:8px}
.top h1{margin:0;font-size:15px;font-weight:600}
.seg{display:flex;gap:4px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;align-self:flex-start;backdrop-filter:blur(10px)}
.seg button{background:transparent;border:0;color:var(--tx);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#1a1408;font-weight:600}
.lv{display:none;gap:6px;pointer-events:auto}
.lv button,.chip{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;backdrop-filter:blur(10px);white-space:nowrap}
.lv button.on,.chip.on{background:rgba(232,184,106,.22);border-color:var(--acc);color:#ffe2b0}
body.m-doll .lv,body.m-edit .lv{display:flex}
body.m-edit .zones{display:none}
.note{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5}
.selbox{margin-top:10px;padding:9px 10px;border:1px solid rgba(232,184,106,.35);border-radius:12px;background:rgba(232,184,106,.07)}
.selbox b{font-size:13px;font-weight:600;color:#ffe2b0}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}.cats::-webkit-scrollbar{display:none}
.h4{font-size:12.5px;color:var(--mut);margin-top:12px}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;max-width:460px;margin:0 auto;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:8px 12px 12px;transition:transform .25s;max-height:62vh;overflow:auto}
.sheet.min{transform:translateY(calc(100% - 44px));overflow:hidden}
.grab{display:flex;align-items:center;justify-content:space-between;cursor:pointer;height:28px;position:sticky;top:-8px}
.grab b{font-size:14px;font-weight:600}.grab b em{font-style:normal;color:var(--acc)}
.grab span{font-size:12px;color:var(--mut)}
.zones{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.zones::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
.row label{width:82px;flex:none;font-size:12.5px;color:var(--mut)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw i{width:25px;height:25px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;display:block}
.sw i.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
input[type=range]{flex:1;accent-color:var(--acc)}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg button{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
.tg button.on{background:rgba(232,184,106,.18);border-color:var(--acc);color:#ffe2b0}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border-radius:10px;padding:9px;text-align:center;background:transparent;border:1px solid var(--line);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.btn.pri{background:var(--acc);color:#1a1408;border:0;font-weight:600}
#vid{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:110px 10px 20px;z-index:5}
#vid video{width:100%;max-width:1100px;max-height:68vh;border-radius:10px;background:#000}
#vid .vt{display:flex;gap:6px}
#vid small{color:var(--mut)}
body.m-vid .sheet{display:none}
.joy{position:fixed;left:18px;bottom:62px;width:112px;height:112px;border-radius:50%;background:rgba(20,22,26,.45);border:1px solid rgba(255,255,255,.25);display:none;touch-action:none;backdrop-filter:blur(6px)}
.joy i{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(0,0,0,.4)}
body.m-walk .joy{display:block}
.hint{position:fixed;left:50%;top:140px;transform:translateX(-50%);font-size:12px;color:#dfe3e7;background:rgba(0,0,0,.4);padding:5px 11px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.7);display:none;pointer-events:none}
body.m-walk .cross{display:block}
.tag{position:fixed;left:12px;top:100px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;display:none}
body.m-walk .tag{display:block}
body.video .top,body.video .sheet,body.video .hint,body.video .joy,body.video .tag,body.video .cross{display:none!important}
</style>
</head>
<body class="m-ext">
<canvas id="c"></canvas>
<div class="top">
  <h1><a href="index.html" style="pointer-events:auto;color:#e8b86a;text-decoration:none;margin-right:8px">‹ เว็บไซต์</a>บ้านราชบุรี · โมเดล 3D</h1>
  <div class="seg" id="modes"><button data-m="ext" class="on">ภายนอก</button><button data-m="doll">ผังห้อง</button><button data-m="edit">จัดห้อง</button><button data-m="walk">เดินชม</button><button data-m="vid">วิดีโอ</button></div>
  <div class="lv" id="lv"><button data-l="1" class="on">ชั้น 1</button><button data-l="2">ชั้น 2</button></div>
</div>
<div class="hint" id="hint">ลากเพื่อหมุน · บีบ/สกรอลเพื่อซูม</div>

<div class="cross"></div>
<div class="joy" id="joy"><i></i></div>

<div class="sheet" id="sheet">
  <div class="grab" id="grab"><b>ปรับแต่ง: <em id="zname">ภายนอกบ้าน</em></b><span id="gs">ซ่อน ▾</span></div>
  <div class="zones" id="zones"></div>
  <div id="ctl"></div>

</div>

<div id="vid"><div class="vt"><button class="chip on" data-v="house_360.mp4">รอบบ้าน 360°</button><button class="chip" data-v="house_tour.mp4">เดินชมภายใน</button></div><video id="vv" controls playsinline loop src="house_360.mp4"></video><small id="vcap">วิดีโอหมุนรอบบ้าน 360° · 1280×720</small></div>

<script>
"use strict";
const Q=new URLSearchParams(location.search);
const VIDEO=Q.get('mode')==='video';
if(VIDEO)document.body.classList.add('video');

// ================= zones (from plan A-04 / A-05) =================
// rect: [x0,z0,x1,z1,floorY,ceilY]; X = grid 1→6, Z = grid A→F
const ZONES=[
 {id:0,n:'ภายนอกบ้าน',lv:0},
 {id:1,n:'ห้องรับแขก',lv:1,r:[[6.5,0,16,4.5,.6,3.9]],cam:[15.0,3.6,-1.93]},

 {id:3,n:'โถง / บันได',lv:1,r:[[3.4,4.5,6.5,6.3,.6,3.6],[0,4.5,3.4,6.3,.6,7.0],[2.6,6.3,6.5,8.5,.6,3.6]],cam:[5.6,7.9,-2.21]},
 {id:4,n:'ห้องน้ำ 3',lv:1,r:[[0,6.3,2.6,8.5,.5,3.6]],cam:[2.2,7.0,-1.23]},
 {id:5,n:'ห้องทานอาหาร',lv:1,r:[[0,8.5,6.5,12,.6,3.6],[0,12,6.5,14.8,.6,7.0]],cam:[5.6,9.0,-0.66]},
 {id:6,n:'เฉลียง',lv:1,r:[[6.5,4.5,16,6.3,.6,3.9]],cam:[15.2,5.4,-1.57]},
 {id:7,n:'ห้องเด็ก (นอน 3)',lv:2,r:[[1,0,3.5,4.5,3.3,7.0]],cam:[3.0,3.9,-2.58]},
 {id:8,n:'ห้องทำงาน (นอน 2)',lv:2,r:[[3.5,0,6.5,3.0,3.3,7.0]],cam:[6.0,2.7,-2.54]},
 {id:9,n:'ห้องนอนใหญ่ (นอน 1)',lv:2,r:[[2.1,8.5,6.5,10.1,3.9,7.0],[0,10.1,6.5,12,3.9,7.0]],cam:[5.9,8.9,-0.84]},
 {id:10,n:'โถงชั้น 2',lv:2,r:[[3.5,3.0,6.5,4.5,3.3,7.0],[3.4,4.5,6.5,6.3,3.9,7.0],[3.9,6.3,6.5,8.5,3.9,7.0]],cam:[5.2,8.0,3.14]},
 {id:11,n:'ห้องน้ำ 1',lv:2,r:[[0,6.3,2.1,10.1,3.8,7.0]],cam:[1.4,9.7,3.14]},
 {id:12,n:'ห้องน้ำ 2',lv:2,r:[[2.1,6.3,3.9,8.5,3.8,7.0]],cam:[3.5,7.0,-1.57]},
 {id:13,n:'ระเบียง',lv:2,r:[[6.5,8.5,7.05,12,3.9,0]],cam:[6.8,11.5,3.14]},
];
const FLOORS=['แกรนิตโต้ 60×60 ขาวด้าน','ลามิเนตลายโอ๊ค 8 มม.','กระเบื้องเซรามิก 30×30','ปูนขัดมัน (ลอฟต์)','หินอ่อนคาร์ราร่า 80×80','ไม้เทียม WPC','SPC ลายวอลนัท','เทอราซโซ่','แกรนิตโต้ 60×120 ลายหินเทา'];
const WOODS=[['โอ๊คธรรมชาติ','#a8794a'],['วอลนัท','#5b3a24'],['สัก','#8c5a30'],['ไวท์โอ๊ค','#cdb08a'],['ลามิเนตขาวด้าน','#e9e6df'],['เทาเข้ม (HPL)','#4b4b4d']];
const DEF={1:['#e8e2d8',4,'#b8ad9d'],2:['#eeeae3',8,'#2b2d30'],3:['#e8e2d8',4,'#2b2d30'],4:['#d9d4cc',2,'#2b2d30'],5:['#e8e2d8',4,'#3a3633'],6:['#f2efe9',5,'#d8cfc2'],
 7:['#e3e8ea',1,'#a9bccb'],8:['#dcd6cc',6,'#4a4f55'],9:['#e4dcd0',6,'#b9aa96'],10:['#e8e2d8',6,'#7a5a3c'],11:['#d9d4cc',2,'#2b2d30'],12:['#d9d4cc',2,'#2b2d30'],13:['#f2efe9',2,'#d8cfc2']};
const LIGHTS=[[1,8.6,3.85,2.2],[1,12.6,3.85,2.2],[2,3.7,2.95,2.2],[3,4.8,3.55,5.4],[3,1.8,6.95,5.4],[3,4.5,3.55,7.4],[4,1.3,3.55,7.4],[5,3.2,2.85,11.1],[5,3.2,6.95,13.4],[6,9.5,3.85,5.4],[6,13.5,3.85,5.4],
 [7,2.3,6.95,2.2],[8,5,6.95,1.5],[9,4.2,6.95,10.6],[10,5,6.95,5.4],[11,1,6.95,8.2],[12,3,6.95,7.4]];

// ================= state =================
const S={wall:'#f2efe9',acc:'#3a3c40',wood:'#6b4a2f',stone:'#8f8a82',tod:38,trees:true,slats:true,spin:!VIDEO,Z:{}};
const DEFW={1:1,2:1,3:1,4:1,5:1,6:2,7:3,8:1,9:1,10:1,11:1,12:1,13:2};
const DEFF={4:4,11:7,12:4};
for(const z of ZONES)if(z.id)S.Z[z.id]={wall:DEF[z.id][0],floor:DEF[z.id][1],furn:DEF[z.id][2],wood:DEFW[z.id],fin:DEFF[z.id]||0,show:true,light:true};
const PAL={wall:['#f2efe9','#e9e4da','#d9d4cc','#c7c2b8','#ece3d3','#dfe6e8'],acc:['#3a3c40','#1f2124','#6d6f73','#f2efe9','#8a6a4a'],wood:['#6b4a2f','#8a5f3a','#3e2b1d','#b08257','#2b2b2b'],stone:['#8f8a82','#6e6a64','#a89a86','#5b5853','#b9b2a6'],
 iwall:['#f2efe9','#ece6dc','#e4ded3','#d6d3cd','#c9cdd0','#dfe6e1','#efe1d1','#b8a990','#7d8a86','#5d6266','#2f3438'],
 furn:['#8b8f94','#3d4a4f','#b9c4c9','#c9b9a6','#9aa8a0','#8a6a4a','#d8cfc2','#f4f4f2','#2b2d30','#a65d3f','#4a5d7a']};
try{const sv=JSON.parse(localStorage.getItem('rb-house7')||'null');if(sv&&!VIDEO){const z=sv.Z;delete sv.Z;Object.assign(S,sv,{spin:true});if(z)for(const k in z)if(S.Z[k])Object.assign(S.Z[k],z[k]);}}catch(e){}
for(const k of ['wall','acc','wood','stone'])if(Q.get(k))S[k]='#'+Q.get(k);
if(Q.get('tod'))S.tod=+Q.get('tod');
const save=()=>{try{localStorage.setItem('rb-house7',JSON.stringify(S));}catch(e){}};

// ================= GL =================
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{antialias:false,preserveDrawingBuffer:VIDEO,alpha:false});
if(!gl){document.body.innerHTML='<p style="padding:20px">อุปกรณ์นี้ไม่รองรับ WebGL2 — ดูวิดีโอแทนได้ที่ <a href="house_360.mp4" style="color:#e8b86a">วิดีโอ 360°</a></p>';throw 0;}

// ================= geometry =================
const M={brass:34,blackm:26,screen:27,steel:28,rattan:29,shade:30,down:31,pillow:32,pot:33,wall:0,stone:1,wood:2,glass:3,frame:4,conc:5,grass:6,pave:7,deck:8,acc:9,leaf:10,trunk:11,roof:12,soff:13,floor:14,ceil:15,furn:16,woodf:17,linen:18,dark:19,metal:20,white:21,top:22,lamp:23,rug:24,mirror:25};
let G,COL,SURF,SCOL=[],DCOL=[];
function Geo(){this.a=[];this.g=[];}
Geo.prototype.quad=function(p0,p1,p2,p3,n,m,z){const a=m===M.glass?this.g:this.a;for(const p of [p0,p1,p2,p0,p2,p3])a.push(p[0],p[1],p[2],n[0],n[1],n[2],m,z);};
Geo.prototype.box=function(x0,y0,z0,x1,y1,z1,m,zn,col){
  zn=zn||0;const q=(a,b,c,d,n)=>this.quad(a,b,c,d,n,m,zn);
  q([x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[0,1,0]);
  q([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[0,-1,0]);
  q([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1]);
  q([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[0,0,-1]);
  q([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[1,0,0]);
  q([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[-1,0,0]);
  if(col)COL.push([x0,y0,z0,x1,y1,z1]);
};
Geo.prototype.blob=function(cx,cy,cz,r,ry,m,seed,zn){zn=zn||0;
  const N=14,Mm=9,a=this.a,P=(i,j)=>{const th=i/N*Math.PI*2,ph=j/Mm*Math.PI;const nx=Math.sin(ph)*Math.cos(th),ny=Math.cos(ph),nz=Math.sin(ph)*Math.sin(th);
    const d=1+0.13*Math.sin(th*3+seed)*Math.sin(ph*4+seed*1.7)+0.07*Math.sin(th*7+seed*2.1);return [cx+nx*r*d,cy+ny*ry*d,cz+nz*r*d,nx,ny,nz];};
  for(let i=0;i<N;i++)for(let j=0;j<Mm;j++){const A=P(i,j),B=P(i+1,j),C=P(i+1,j+1),D=P(i,j+1);for(const p of [A,B,C,A,C,D])a.push(p[0],p[1],p[2],p[3],p[4],p[5],m,zn);}
};
Geo.prototype.rbox=function(x0,y0,z0,x1,y1,z1,r,m,zn,col){zn=zn||0;const a=m===M.glass?this.g:this.a;
  const C=[(x0+x1)/2,(y0+y1)/2,(z0+z1)/2],Hh=[(x1-x0)/2,(y1-y0)/2,(z1-z0)/2];r=Math.min(r,Hh[0],Hh[1],Hh[2]);const I=Hh.map(h=>h-r);
  const T=[0,.2679,.5774,1];const L=k=>{const h=Hh[k],i=I[k];return [-h,...T.slice(1,3).reverse().map(t=>-i-r*t),-i,i,...T.slice(1,3).map(t=>i+r*t),h];};
  const map=p=>{const c=p.map((v,k)=>Math.max(-I[k],Math.min(I[k],v)));let d=p.map((v,k)=>v-c[k]);const l=Math.hypot(...d)||1;d=d.map(v=>v/l);return [C[0]+c[0]+d[0]*r,C[1]+c[1]+d[1]*r,C[2]+c[2]+d[2]*r,d];};
  for(let k=0;k<3;k++)for(const s of[-1,1]){const i=(k+1)%3,j=(k+2)%3,Li=L(i),Lj=L(j);
    for(let u=0;u<Li.length-1;u++)for(let v=0;v<Lj.length-1;v++){const q=(uu,vv)=>{const p=[0,0,0];p[k]=s*Hh[k];p[i]=Li[uu];p[j]=Lj[vv];return map(p);};
      const A=q(u,v),B=q(u+1,v),Cc=q(u+1,v+1),D=q(u,v+1);
      for(const tri of [[A,B,Cc],[A,Cc,D]]){const e1=[0,1,2].map(t=>tri[1][t]-tri[0][t]),e2=[0,1,2].map(t=>tri[2][t]-tri[0][t]);const cn=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
        const nn=tri[0][3];const ord=cn[0]*nn[0]+cn[1]*nn[1]+cn[2]*nn[2]<0?[tri[0],tri[2],tri[1]]:tri;for(const P of ord)a.push(P[0],P[1],P[2],P[3][0],P[3][1],P[3][2],m,zn);}}}
  if(col)COL.push([x0,y0,z0,x1,y1,z1]);};
Geo.prototype.cyl=function(cx,y0,cz,r,y1,m,zn,col){const N=16,a=this.a;for(let i=0;i<N;i++){const t0=i/N*6.2832,t1=(i+1)/N*6.2832;const c0=Math.cos(t0),s0=Math.sin(t0),c1=Math.cos(t1),s1=Math.sin(t1);
  for(const p of [[c0,y0,s0],[c1,y0,s1],[c1,y1,s1],[c0,y0,s0],[c1,y1,s1],[c0,y1,s0]])a.push(cx+p[0]*r,p[1],cz+p[2]*r,p[0],0,p[2],m,zn);
  for(const p of [[0,0],[c1,s1],[c0,s0]])a.push(cx+p[0]*r,y1,cz+p[1]*r,0,1,0,m,zn);}
  if(col)COL.push([cx-r,y0,cz-r,cx+r,y1,cz+r]);};

// wall builder. axis 'x': plane ⟂ X at c, spanning a along Z. zn = zone on −side, zp = zone on +side.
// ops: {a0,a1,y0,y1,k:'win'|'slide'|'open',p:panes,tr:transom}

    if(s.ramp){const r=s.ramp,k=Math.min(1,Math.max(0,(x-r.x0)/(r.x1-r.x0)));y=r.y0+(r.y1-r.y0)*k;}
    if(y<=cur+0.62&&y>best)best=y;}
  return best;}

    if(x+r>b[0]&&x-r<b[3]&&z+r>b[2]&&z-r<b[5])return true;}return false;}
function tryMove(dx,dz){for(const [mx,mz] of [[dx,dz],[dx,0],[0,dz]]){if(!mx&&!mz)continue;const nx=P.x+mx,nz2=P.z+mz;const f=floorAt(nx,nz2,P.foot);

    else if(SELI&&SELI.kind==='wall'&&getWall(SELI.id)){const w=getWall(SELI.id);const L=Math.hypot(w.x1-w.x0,w.z1-w.z0);sb.innerHTML=`<b>ผนังกั้นห้อง · ยาว ${L.toFixed(2)} ม.</b>`;const a=document.createElement('div');a.className='acts';
      a.append(btn(w.door?'ปิดช่องประตู':'เจาะช่องประตู',()=>{if(L<1.1)return;pushUndo();w.door=!w.door;commit();panel();}),btn('ลบผนัง',()=>{pushUndo();S.walls=S.walls.filter(x=>x!==w);SELI=null;commit();panel();}));sb.append(a);
      if(w.door&&L>=1.1){const dd=document.createElement('div');
        dd.append(row('ชนิดประตู',chips(['ช่องประตู','ประตูกระจกบานเลื่อน'],w.dk==='slide'?1:0,i=>{w.dk=i?'slide':'open';commit();})));
        dd.append(slider('กว้างประตู',0.7,Math.min(3,L-.2).toFixed(2),0.05,(w.dw||.9),v=>v.toFixed(2)+' ม.',v=>{w.dw=v;uploadDyn();save();}));
        dd.append(slider('สูงประตู',1.9,2.8,0.05,(w.dh||2.1),v=>v.toFixed(2)+' ม.',v=>{w.dh=v;uploadDyn();save();}));
        dd.append(slider('เลื่อนตำแหน่ง',(-L/2).toFixed(2),(L/2).toFixed(2),0.05,(w.doff||0),v=>(v>=0?'+':'')+v.toFixed(2),v=>{w.doff=v;uploadDyn();save();}));sb.append(dd);}}
    else sb.innerHTML=TOOL==='wall'?'<span class="note">ลากนิ้วบนพื้นจากจุดเริ่มไปจุดสิ้นสุดเพื่อวาดผนัง (ตั้งฉากอัตโนมัติ สูงจรดฝ้า) · แตะผนังที่วาดแล้วเพื่อเจาะประตูหรือลบ</span>':'<span class="note">แตะเฟอร์นิเจอร์หรือผนังที่เพิ่มเพื่อเลือก แล้วลากเพื่อย้าย · แตะหน้าต่าง/ประตูเพื่อแก้หรือลบ · แตะผนังเพื่อเปลี่ยนผิว เจาะช่อง หรือลบผนัง · ลากพื้นที่ว่างเพื่อหมุนมุมมอง</span>';
    ctl.append(sb);
    const h=document.createElement('div');h.className='h4';h.textContent='เพิ่มเฟอร์นิเจอร์ (วางกลางจอ ชั้น '+LEVEL+')';ctl.append(h);
    const groups=[...new Set(Object.values(CAT).map(c=>c.g))];const gc=document.createElement('div');gc.className='cats';
    groups.forEach(g=>{const b=document.createElement('button');b.className='chip'+(g===GRP?' on':'');b.textContent=g;b.onclick=()=>{GRP=g;panel();};gc.append(b);});ctl.append(gc);
    const ic=document.createElement('div');ic.className='tg';ic.style.marginTop='8px';
    for(const k in CAT)if(CAT[k].g===GRP){const b=document.createElement('button');b.textContent='+ '+CAT[k].n;b.onclick=()=>addItem(k);ic.append(b);}ctl.append(ic);
    const a=document.createElement('div');a.className='acts';
    a.append(btn('ย้อนกลับ',()=>{const u=UNDO.pop();if(!u)return;const o=JSON.parse(u);Object.assign(S,o);SELI=null;upload();save();panel();}),
      btn('รีเซ็ตการจัดวาง',()=>{pushUndo();S.items=JSON.parse(JSON.stringify(ITEMS0));S.walls=[];SELI=null;commit();panel();}));ctl.append(a);
    const nd=Object.keys(S.wdel).length,no=Object.keys(S.opdel).length;if(nd||no){const r2=document.createElement('div');r2.className='acts';
      if(nd)r2.append(btn(`คืนผนังที่ลบ (${nd})`,()=>{pushUndo();S.wdel={};save();upload();panel();}));if(no)r2.append(btn(`คืนประตู/หน้าต่างที่ลบ (${no})`,()=>{pushUndo();S.opdel={};save();upload();panel();}));ctl.append(r2);}}
  // keyboard shortcuts in edit mode
  addEventListener('keydown',e=>{if(MODE!=='edit'||!SELI)return;const k=e.key.toLowerCase();
    if(k==='r'&&SELI.kind==='item'){const it=getItem(SELI.id);pushUndo();it.r=(it.r+1)%4;commit();}
    if(k==='delete'||k==='backspace'){pushUndo();if(SELI.kind==='item')S.items=S.items.filter(x=>x.id!==SELI.id);else S.walls=S.walls.filter(x=>x.id!==SELI.id);SELI=null;commit();panel();}});
  // joystick + keys
  const joy=$('joy'),knob=joy.firstElementChild;let JV=[0,0],jid=null;
  joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e);});
  const jm=e=>{if(e.pointerId!==jid)return;const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}JV=[x,y];knob.style.transform=`translate(${x*36}px,${y*36}px)`;};
  joy.addEventListener('pointermove',jm);
  const je=()=>{jid=null;JV=[0,0];knob.style.transform='';};joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
  const K={};addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;});addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0;});
  let last=performance.now(),lastZ=-1;
  (function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(MODE==='ext'&&S.spin)C.yaw+=dt*0.12;
    if(MODE==='walk'){let f=-JV[1],s=JV[0];if(K.w||K.arrowup)f=1;if(K.s||K.arrowdown)f=-1;if(K.a)s=-1;if(K.d)s=1;if(K.arrowleft)P.yaw+=dt*1.8;if(K.arrowright)P.yaw-=dt*1.8;
      const sp=2.0*dt;if(f||s){const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);tryMove((sy*f-cy*s)*sp,(cy*f+sy*s)*sp);}
      let z=zoneAt(P.x,P.z,P.foot);if(!z&&P.x>0&&P.x<16&&P.z>0&&P.z<14.8&&lastZ>0)z=lastZ;if(z!==lastZ){lastZ=z;$('tag').textContent=(z?ZONES[z].n:'ภายนอกบ้าน');if(z!==SEL){SEL=z;panel();}}}
    if(MODE!=='vid')render(now);requestAnimationFrame(loop);})(last);
  SEL=0;panel();setMode('ext');
}
</script>
